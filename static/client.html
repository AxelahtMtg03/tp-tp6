<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Réducteur d'URL — Client AJAX</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin: 1.5rem 0;
      }
      input,
      button {
        padding: 0.5rem;
        font-size: 1rem;
      }
      .result {
        margin-top: 1rem;
        padding: 1rem;
        background: #f2f2f2;
        border-radius: 8px;
      }
      .result a {
        word-break: break-all;
      }
      .error {
        color: #b00020;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Réducteur d'URL</h1>

    <form id="submit-link">
      <label for="url">Type the URL to shorten</label>
      <input
        name="url"
        id="url"
        type="url"
        placeholder="https://perdu.com"
        required
      />
      <button type="submit">Submit</button>
    </form>

    <div id="result" class="result hidden">
      <p>Lien créé :</p>
      <p><a id="short-link" href="#"></a></p>
      <button id="copy-btn" type="button">Copier l'URL</button>
    </div>

    <p id="error" class="error hidden"></p>

    <script src="/app.js" type="module"></script>
  </body>
</html>
