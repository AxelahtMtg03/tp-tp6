openapi: 3.0.3
info:
  title: URL Shortener API
  version: 1.0.0
servers:
  - url: http://localhost:8080/api-v1
    description: API v1
  - url: http://localhost:8080/api-v2
    description: API v2
paths:
  /:
    get:
      summary: Nombre de liens créés
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
    post:
      summary: Créer un lien réduit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
      responses:
        "201":
          description: Lien créé
        "400":
          description: URL invalide
  /error:
    get:
      summary: Route de test qui renvoie une erreur 500
      responses:
        "500":
          description: Internal Server Error
  /status/{url}:
    get:
      summary: Informations sur un lien
      parameters:
        - in: path
          name: url
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "404":
          description: Lien non trouvé
  /{url}:
    get:
      summary: Redirige vers l'URL d'origine (HTML) ou renvoie les infos (JSON)
      parameters:
        - in: path
          name: url
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirection
        "404":
          description: Lien non trouvé
    delete:
      summary: Supprime un lien
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: url
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lien supprimé
        "401":
          description: En-tête X-API-Key manquant
        "403":
          description: Clé invalide
        "404":
          description: Lien non trouvé
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key